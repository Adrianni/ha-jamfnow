set_blueprint:
  target:
    device:
      integration: jamfnow
  fields:
    blueprint_id:
      required: true
      example: "86136069-bab5-4a9f-893d-a1b2c3d4e5f6"
      selector:
        text:
enable_lost_mode:
  target:
    device:
      integration: jamfnow
  fields:
    message:
      example: "Device lost. Call IT."
      selector:
        text:
          multiline: true
    phone:
      example: "+4712345678"
      selector:
        text:
          type: tel
    footnote:
      example: "Return to front desk"
      selector:
        text:
          multiline: true
    play_sound:
      example: true
      selector:
        boolean:
disable_lost_mode:
  target:
    device:
      integration: jamfnow
play_sound:
  target:
    device:
      integration: jamfnow
restart_device:
  target:
    device:
      integration: jamfnow
shutdown_device:
  target:
    device:
      integration: jamfnow
sync_inventory:
  target:
    device:
      integration: jamfnow
